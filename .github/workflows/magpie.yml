name: Magpie

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# The release step rewrites the magpie-latest prerelease with each green
# build's APK, so there is always one obvious thing to install.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle is installed by the action rather than run from a wrapper jar:
      # Magpie is developed from a phone, and a binary jar cannot be committed
      # from one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle :magpie:assembleDebug

      - name: Run unit tests
        run: gradle :magpie:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magpie-debug-apk
          path: magpie/build/outputs/apk/debug/*.apk

      # Artifacts come wrapped in a zip and need a GitHub login; a release
      # asset is a bare .apk at a stable link a phone can just download.
      - name: Publish the APK as the magpie-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: magpie-latest
          name: Magpie (latest green build)
          prerelease: true
          body: |
            Debug APK from ${{ github.sha }}. Rewritten on every green build.
            Install steps and the ColorOS battery settings are in magpie/README.md.
          files: magpie/build/outputs/apk/debug/*.apk

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: magpie-test-report
          path: magpie/build/reports/tests/
