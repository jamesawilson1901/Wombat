name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Surfaces what the installer cares about: signing certificate, package
      # name, SDK levels, and the testOnly flag that silently blocks sideloads.
      - name: Inspect debug APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "=== apk: $APK ($(stat -c%s "$APK") bytes) ==="
          "${BT}apksigner" verify --print-certs -v "$APK" || true
          echo "=== badging ==="
          "${BT}aapt2" dump badging "$APK" | head -15 || true
          echo "=== manifest flags ==="
          "${BT}aapt2" dump xmltree "$APK" --file AndroidManifest.xml \
            | grep -iE "testOnly|debuggable|package=|SdkVersion" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
